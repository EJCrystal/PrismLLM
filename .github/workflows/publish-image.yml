name: Publish GHCR image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify source and successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$SOURCE_SHA" != "$main_sha" ]; then
            echo "::notice::Skipping publication because the source commit is no longer main."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          successful_runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$SOURCE_SHA" -f status=success -f per_page=1 \
            --jq '.workflow_runs | length')"
          if [ "$successful_runs" -eq 0 ]; then
            echo "::error::The source commit must have a successful main CI run before publication."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check out verified source
        if: steps.source.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.source.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        if: steps.source.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        if: steps.source.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.image }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote current source to main
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$SOURCE_SHA" != "$main_sha" ]; then
            echo "::notice::Keeping only the SHA image because main changed during the build."
            exit 0
          fi

          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$DIGEST"
