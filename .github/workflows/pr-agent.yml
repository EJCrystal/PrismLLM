name: AI Review Gatekeeper (CodeRabbit & PR-Agent)

'on':
  # 场景 1：PR 打开或推新 commit 时，初始化门禁状态为 pending，防止审查未跑完就误合并
  pull_request:
    types: [opened, synchronize, reopened]

  # 场景 2：Check Run 结束时（CodeRabbit 成功放行，或超额时自动唤醒 PR-Agent 兜底）
  check_run:
    types: [completed]

  # 场景 3：开发者在评论区主动使用指令（如 /review, /improve, /ask）
  issue_comment:
    types: [created]

  # 场景 4：手动在 GitHub 页面点击 Run workflow 触发验证
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request 编号（如 74、75，用于手动指定测试目标）'
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read
  statuses: write

jobs:
  # 1. PR 打开或更新时，将 AI Review Gate 置为 pending
  init_gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set AI Review Gate to Pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="pending" \
            -f context="AI Review Gate" \
            -f description="等待 CodeRabbit 或 PR-Agent 审查完成..." || true

  # 2. CodeRabbit 正常完成且未超额时，将 AI Review Gate 标记为 success 放行
  coderabbit_gate:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.conclusion == 'success' &&
      !contains(github.event.check_run.output.title, 'rate limited') &&
      !contains(github.event.check_run.output.summary, 'Rate limited')
    runs-on: ubuntu-latest
    steps:
      - name: Mark Gate as Success by CodeRabbit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
        run: |
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="success" \
            -f context="AI Review Gate" \
            -f description="CodeRabbit 审查通过" || true

  # 2.5 CodeRabbit 因 star < 10 跳过审查时，自动帮它发一条 @coderabbitai review，
  #     让它真正参与审查而不是被静默跳过；PR-Agent 兜底不受影响，两者互补。
  #     同一 HEAD SHA 只邀请一次，连续 push 不会刷屏。
  request_coderabbit_review:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.conclusion == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Invite CodeRabbit to review once per head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_PR_URL: ${{ github.event.check_run.pull_requests[0].url }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$CHECK_PR_URL" ] && [ "$CHECK_PR_URL" != "null" ]; then
            PR_NUMBER="${CHECK_PR_URL##*/}"
          else
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "未找到对应的 PR，跳过。"
            exit 0
          fi
          STARS=$(gh api "repos/${REPO}" -q .stargazers_count)
          if [ "${STARS}" -ge 10 ]; then
            echo "仓库已有 ${STARS} stars，CodeRabbit 后续会自动审查，无需邀请。"
            exit 0
          fi
          MARKER="<!-- coderabbit-skip-invite:${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              -q "[.[] | select(.body | contains(\"${MARKER}\"))] | length" \
              | grep -qv '^0$'; then
            echo "该 HEAD SHA 已邀请过 CodeRabbit 审查，跳过。"
            exit 0
          fi
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="${MARKER}
          > 💡 **提示**：当前仓库 star 数不足 10，CodeRabbit 已跳过自动审查，已自动发送 @coderabbitai review 邀请其参与本次审查。PR-Agent 兜底审查不受影响。" || true
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="@coderabbitai review" || true
          sleep 30

  # 3. 兜底与手动触发：CodeRabbit 未完成审查或手动 Run workflow 时，发一条真实的 /review 评论，
  #    统一走 issue_comment 路径（job 4）。容器内伪造事件不可行：$GITHUB_ENV 无法覆盖
  #    GITHUB_EVENT_NAME，PR-Agent 收到的仍是 check_run/workflow_dispatch，会在
  #    apply_repo_settings 后直接 exit 0。
  #    /review 必须用 PAT 发送：GITHUB_TOKEN 发出的评论不会触发新的 workflow，
  #    且 sender 为 Bot，会被 job 4 与 PR-Agent 自身的 Bot 过滤跳过。
  trigger_pr_agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug == 'coderabbitai' &&
        (
          github.event.check_run.conclusion != 'success' ||
          contains(github.event.check_run.output.title, 'rate limited') ||
          contains(github.event.check_run.output.summary, 'Rate limited')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Post /review to trigger PR-Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_TOKEN: ${{ secrets.PR_AGENT_TRIGGER_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_PR_URL: ${{ github.event.check_run.pull_requests[0].url }}
          CHECK_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPLAY_MODEL: ${{ vars.LLM_GATEWAY_REVIEW_MODEL || 'deepseek-chat' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "check_run" ]; then
            HEAD_SHA="$CHECK_HEAD_SHA"
            if [ -n "$CHECK_PR_URL" ] && [ "$CHECK_PR_URL" != "null" ]; then
              PR_NUMBER="${CHECK_PR_URL##*/}"
            else
              PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[0].number // empty')
            fi
            if [ -z "$PR_NUMBER" ]; then
              echo "未找到对应的 PR，跳过 check_run 兜底审查。"
              exit 0
            fi
          else
            if ! [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number 必须是数字：$DISPATCH_PR"
              exit 1
            fi
            PR_NUMBER="$DISPATCH_PR"
            HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" -q .head.sha)
          fi

          set_gate() {
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="AI Review Gate" -f description="$2" || true
          }

          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "::error::未配置 secret PR_AGENT_TRIGGER_TOKEN，无法触发 PR-Agent 兜底审查"
            set_gate failure "缺少 PR_AGENT_TRIGGER_TOKEN，无法触发 PR-Agent"
            exit 1
          fi

          # CodeRabbit 的 check 可能在同一 SHA 上多次结束，兜底只触发一次；手动触发不去重。
          MARKER="<!-- pr-agent-fallback:${HEAD_SHA} -->"
          if [ "$EVENT_NAME" = "check_run" ]; then
            SEEN=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select((.body // \"\") | contains(\"${MARKER}\")) | .id" | wc -l)
            if [ "$SEEN" -gt 0 ]; then
              echo "该 HEAD SHA 已触发过 PR-Agent 兜底审查，跳过。"
              exit 0
            fi
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${MARKER}
          > 💡 **提示**：检测到 CodeRabbit 未完成审查（跳过或超额），已自动无缝切换至 **PR-Agent（模型：${DISPLAY_MODEL}）** 进行代码审查与改进建议。"
          fi

          # 指令必须独占评论正文，PR-Agent 只识别以 / 开头的评论。
          if ! GH_TOKEN="$TRIGGER_TOKEN" gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="/review" > /dev/null; then
            echo "::error::使用 PR_AGENT_TRIGGER_TOKEN 发送 /review 失败，请检查 token 是否过期或缺少 Issues 写权限"
            set_gate failure "发送 /review 失败，请检查 PR_AGENT_TRIGGER_TOKEN"
            exit 1
          fi
          set_gate pending "已触发 PR-Agent 审查，等待结果..."
          echo "已在 PR #${PR_NUMBER} 发送 /review（HEAD ${HEAD_SHA}）"

  # 4. 核心审查 Job：评论区 /review 等指令（含 job 3 代发的 /review）
  pr_agent_review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 解析模型名称：复用 GitHub Variables 中配置的 LLM_GATEWAY_REVIEW_MODEL
      - name: Resolve Model Configuration
        id: model_setup
        run: |
          RAW_MODEL="${{ vars.LLM_GATEWAY_REVIEW_MODEL || 'deepseek-chat' }}"
          if [[ "$RAW_MODEL" != *"/"* ]]; then
            RESOLVED_MODEL="openai/$RAW_MODEL"
          else
            RESOLVED_MODEL="$RAW_MODEL"
          fi
          {
            echo "RESOLVED_MODEL=$RESOLVED_MODEL"
            echo "DISPLAY_MODEL=$RAW_MODEL"
          } >> "$GITHUB_ENV"

      # 获取 PR 编号与 HEAD_SHA，供门禁步骤使用
      - name: Prepare PR Event Context
        id: prepare_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          HEAD_SHA=$(gh api "$COMMENT_PR_URL" -q .head.sha)
          PR_NUMBER="${COMMENT_PR_URL##*/}"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Run PR Agent with LLM Gateway
        id: run_pr_agent
        # 直接按 digest 运行 github_action 镜像，绕开 action 包装层：
        # qodo-ai/pr-agent@v0.49.0 的 Dockerfile 只是 FROM
        # pragent/pr-agent:github_action（滚动 tag），pin action 版本并不能 pin 住
        # 运行时镜像；该 tag 的新构建会在 apply_repo_settings 内静默退出（无 review、
        # 无错误日志、exit 0）。此 digest 为 2026-10-16 构建，已在本地完整复现
        # （apply_repo_settings 通过、review 正常发起），按上游建议用 digest pin。
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI.KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI.API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          OPENAI__API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          OPENAI_API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          CONFIG.MODEL: ${{ env.RESOLVED_MODEL }}
          CONFIG.FALLBACK_MODELS: "['${{ env.RESOLVED_MODEL }}']"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "128000"
          CONFIG.MAX_MODEL_TOKENS: "64000"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Please write the entire review, summaries, explanations, and advice in Simplified Chinese (简体中文). Pay special attention to security, boundary conditions, and test coverage."
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: "Please write all suggestions and explanations in Simplified Chinese (简体中文)."
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: "Please write the PR description and summary in Simplified Chinese (简体中文)."

      # PR-Agent 执行完成后更新门禁状态。
      # 步骤 exit 0 不等于审查真实发生：曾出现容器静默退出（无评论、无报错、
      # 网关零请求）却把门禁标成通过。这里以 HEAD SHA 上 PR-Agent 的实际输出
      # （review 或评论）为准，没有则判失败，避免假阳性放行。
      - name: Verify review landed and update AI Review Gate
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          OUTCOME: ${{ steps.run_pr_agent.outcome }}
        run: |
          set -euo pipefail
          # PR_NUMBER 为空时从 PR API 反查。
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[0].number // empty')
          fi

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "未找到对应的 PR，无法验证审查产出。"
            if [ -n "${HEAD_SHA}" ]; then
              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="failure" \
                -f context="AI Review Gate" \
                -f description="未找到关联 PR，无法验证审查" || true
            fi
            exit 1
          fi

          landed=false
          ACTIVE_FINDINGS=0
          if [ "$OUTCOME" = "success" ]; then
            # PR-Agent 的输出：issue 评论（walkthrough/摘要）或 review（/review 的评审）。
            # 以 HEAD SHA 起算：本次运行之后才产生的 bot 输出才算本次审查落地。
            START_EPOCH=$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}" -q .run_started_at | xargs -I{} date -d "{}" +%s)
            START_EPOCH=$((START_EPOCH - 60))
            while IFS= read -r line; do
              created=$(echo "$line" | jq -r '.createdAt // empty')
              [ -z "$created" ] && continue
              author=$(echo "$line" | jq -r '.author')
              body=$(echo "$line" | jq -r '.body // ""')
              created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
              case "$author" in
                github-actions*|pr-agent*|qodo*)
                  if [ "$created_epoch" -ge "$START_EPOCH" ]; then
                    # 排除本 workflow 自身发出的提示评论与失败错误消息，避免假阳性
                    if echo "$body" | grep -qiE "检测到 CodeRabbit|coderabbit-skip-invite|Failed to review PR"; then
                      continue
                    fi
                    if echo "$body" | grep -qiE "PR Reviewer Guide|PR Code Suggestions|<!-- pr-agent:|Persistent review" \
                       || { echo "$body" | grep -qiE "pr-agent" && echo "$body" | grep -q "${HEAD_SHA:0:7}"; }; then
                      landed=true
                      break
                    fi
                  fi
                  ;;
              esac
            done < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json comments --jq '.comments[] | {createdAt, author: (.author.login // ""), body: (.body // "")}')
            if [ "$landed" != "true" ]; then
              while IFS= read -r line; do
                created=$(echo "$line" | jq -r '.submittedAt // empty')
                [ -z "$created" ] && continue
                author=$(echo "$line" | jq -r '.author')
                body=$(echo "$line" | jq -r '.body // ""')
                created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
                case "$author" in
                  github-actions*|pr-agent*|qodo*)
                    if [ "$created_epoch" -ge "$START_EPOCH" ]; then
                      if echo "$body" | grep -qiE "检测到 CodeRabbit|coderabbit-skip-invite|Failed to review PR"; then
                        continue
                      fi
                      if echo "$body" | grep -qiE "PR Reviewer Guide|PR Code Suggestions|<!-- pr-agent:|Persistent review" \
                         || { echo "$body" | grep -qiE "pr-agent" && echo "$body" | grep -q "${HEAD_SHA:0:7}"; }; then
                        landed=true
                        break
                      fi
                    fi
                    ;;
                esac
              done < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json reviews --jq '.reviews[] | {submittedAt, author: (.author.login // ""), body: (.body // "")}')
            fi

            # 产出存在不等于意见已解决：PR-Agent 把结构化 findings 埋在评论末尾的
            #   <!-- pr-agent-review-state:v1
            #   {"findings":[{"state":"ACTIVE",...}], ...}
            #   -->
            # 里，其中 ACTIVE 表示仍未解决。判定规则：
            # - 只统计 PR-Agent 机器人自己的评论：user.type=Bot + 精确登录名。
            #   普通用户贴的伪造状态块直接忽略（否则任何人都能卡住别人的 PR）
            # - 有机器人状态块但登录名不在已知列表（例如换了集成方式）时判失败，
            #   否则作者过滤会把评论全滤掉、门禁退化成"只看产出是否存在"
            # - 只统计 last_seen_head_sha 等于当前 HEAD 的 finding。PR-Agent 会把历史
            #   finding 一直留在列表里、只有再次命中时更新 last_seen_head_sha，按 HEAD
            #   过滤才能让已修复的意见自动失效，而不是永久卡住合并；字段缺失按"属于
            #   当前 HEAD"处理，避免字段改名后门禁静默放行
            # - jq 的 "s" 只影响 ^/$ 锚定，跨行匹配必须用 "m"，这里用 "ms" 兼容两种语义
            # 解析失败按未通过处理（fail closed），不要静默放行。
            if ! COMMENTS_NDJSON=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[]'); then
              echo "::error::拉取 PR 评论失败，无法校验 PR-Agent 意见状态"
              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="failure" \
                -f context="AI Review Gate" \
                -f description="拉取 PR 评论失败，无法校验审查意见" || true
              exit 1
            fi
            if ! REVIEW_STATE=$(
              printf '%s\n' "${COMMENTS_NDJSON}" | jq -sr --arg head "${HEAD_SHA}" '
                  [ .[] | select(.user.type == "Bot")
                        | select((.body // "") | contains("pr-agent-review-state:v1")) ] as $marked
                | [ $marked[]
                    | select(.user.type == "Bot"
                             and (.user.login | IN("github-actions[bot]", "pr-agent[bot]", "qodo-merge-pro[bot]")))
                  ] as $allowed
                | {
                    marked: ($marked | length),
                    allowed: ($allowed | length),
                    active: ([ $allowed[]
                               | .body
                               | (capture("pr-agent-review-state:v1\\s*(?<state>\\{.*?\\})\\s*-->"; "ms").state
                                  // error("unparsable pr-agent review state"))
                               | fromjson
                               | .findings[]?
                               | select(.state == "ACTIVE" and ((.last_seen_head_sha // $head) == $head))
                             ] | length)
                  }
                | "\(.marked) \(.allowed) \(.active)"'
            ); then
              echo "::error::无法解析 PR-Agent 审查状态，按未通过处理"
              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="failure" \
                -f context="AI Review Gate" \
                -f description="PR-Agent 审查状态解析失败，请查看 Actions 日志" || true
              exit 1
            fi
            read -r MARKED_COMMENTS ALLOWED_COMMENTS ACTIVE_FINDINGS <<< "${REVIEW_STATE}"
            if [ "${MARKED_COMMENTS}" -gt 0 ] && [ "${ALLOWED_COMMENTS}" -eq 0 ]; then
              echo "::error::存在 PR-Agent 状态块但没有一条来自已知机器人账号，按未通过处理"
              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="failure" \
                -f context="AI Review Gate" \
                -f description="PR-Agent 状态块作者不在已知机器人列表中" || true
              exit 1
            fi
          fi

          if [ "$landed" = "true" ] && [ "${ACTIVE_FINDINGS}" -gt 0 ]; then
            echo "::error::PR-Agent 仍有 ${ACTIVE_FINDINGS} 条未解决的 ACTIVE 意见，门禁不予放行"
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="failure" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 仍有 ${ACTIVE_FINDINGS} 条未解决意见" || true
            exit 1
          fi

          if [ "$landed" = "true" ]; then
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="success" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 审查通过" || true
          elif [ "$OUTCOME" = "success" ]; then
            echo "::warning::PR-Agent 步骤成功但 PR 上没有它的输出（评论/review），疑似静默失败"
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="failure" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 未产出审查（静默失败），请查看 Actions 日志" || true
            exit 1
          else
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="failure" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 审查未通过或执行异常" || true
            exit 1
          fi
