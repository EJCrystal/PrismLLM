name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent:
    name: Review via gateway
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/')
        )
      )
    # AxonHub listens on 127.0.0.1 only, so the review job must run on the same
    # host. ubuntu-latest cannot reach a loopback-bound service or pass Cloudflare.
    runs-on: ${{ fromJSON(vars.PR_AGENT_RUNNER_LABELS || '["self-hosted", "llm-gateway"]') }}
    timeout-minutes: 30
    steps:
      - name: Run PR-Agent
        # docker run with host networking instead of `uses: docker://`, because a
        # Docker Action runs on a bridge network and would not see 127.0.0.1:8090.
        run: |
          set -euo pipefail
          docker pull pragent/pr-agent:github_action
          docker run --rm --network host \
            -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e GITHUB_TOKEN \
            -e GITHUB_EVENT_NAME -e GITHUB_EVENT_PATH=/github/workflow/event.json \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF \
            -e OPENAI__KEY -e OPENAI__API_BASE \
            -e CONFIG__MODEL -e CONFIG__FALLBACK_MODELS \
            -e CONFIG__RESPONSE_LANGUAGE -e CONFIG__MAX_MODEL_TOKENS \
            -e CONFIG__MAX_OUTPUT_TOKENS \
            -e GITHUB_ACTION_CONFIG__AUTO_REVIEW \
            -e GITHUB_ACTION_CONFIG__AUTO_DESCRIBE \
            -e GITHUB_ACTION_CONFIG__AUTO_IMPROVE \
            -e GITHUB_ACTION_CONFIG__PR_ACTIONS \
            pragent/pr-agent:github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          OPENAI__KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI__API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          CONFIG__MODEL: openai/${{ vars.LLM_GATEWAY_REVIEW_MODEL || 'review-model' }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__RESPONSE_LANGUAGE: "zh-CN"
          CONFIG__MAX_MODEL_TOKENS: "64000"
          CONFIG__MAX_OUTPUT_TOKENS: "16384"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
