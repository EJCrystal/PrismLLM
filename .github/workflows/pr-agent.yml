name: AI Review Gatekeeper (CodeRabbit & PR-Agent)

'on':
  # 场景 1：PR 打开或推新 commit 时，初始化门禁状态为 pending，防止审查未跑完就误合并
  pull_request:
    types: [opened, synchronize, reopened]

  # 场景 2：Check Run 结束时（CodeRabbit 成功放行，或超额时自动唤醒 PR-Agent 兜底）
  check_run:
    types: [completed]

  # 场景 3：开发者在评论区主动使用指令（如 /review, /improve, /ask）
  issue_comment:
    types: [created]

  # 场景 4：手动在 GitHub 页面点击 Run workflow 触发验证
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request 编号（如 74、75，用于手动指定测试目标）'
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read
  statuses: write

jobs:
  # 1. PR 打开或更新时，将 AI Review Gate 置为 pending
  init_gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set AI Review Gate to Pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="pending" \
            -f context="AI Review Gate" \
            -f description="等待 CodeRabbit 或 PR-Agent 审查完成..." || true

  # 2. CodeRabbit 正常完成且未超额时，将 AI Review Gate 标记为 success 放行
  coderabbit_gate:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.conclusion == 'success' &&
      !contains(github.event.check_run.output.title, 'rate limited') &&
      !contains(github.event.check_run.output.summary, 'Rate limited')
    runs-on: ubuntu-latest
    steps:
      - name: Mark Gate as Success by CodeRabbit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.check_run.head_sha }}
        run: |
          gh api "repos/${REPO}/statuses/${SHA}" \
            -f state="success" \
            -f context="AI Review Gate" \
            -f description="CodeRabbit 审查通过" || true

  # 2.5 CodeRabbit 因 star < 10 跳过审查时，自动帮它发一条 @coderabbitai review，
  #     让它真正参与审查而不是被静默跳过；PR-Agent 兜底不受影响，两者互补。
  #     同一 HEAD SHA 只邀请一次，连续 push 不会刷屏。
  request_coderabbit_review:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.conclusion == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Invite CodeRabbit to review once per head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_PR_URL: ${{ github.event.check_run.pull_requests[0].url }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$CHECK_PR_URL" ] && [ "$CHECK_PR_URL" != "null" ]; then
            PR_NUMBER="${CHECK_PR_URL##*/}"
          else
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "未找到对应的 PR，跳过。"
            exit 0
          fi
          STARS=$(gh api "repos/${REPO}" -q .stargazers_count)
          if [ "${STARS}" -ge 10 ]; then
            echo "仓库已有 ${STARS} stars，CodeRabbit 后续会自动审查，无需邀请。"
            exit 0
          fi
          MARKER="<!-- coderabbit-skip-invite:${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              -q "[.[] | select(.body | contains(\"${MARKER}\"))] | length" \
              | grep -qv '^0$'; then
            echo "该 HEAD SHA 已邀请过 CodeRabbit 审查，跳过。"
            exit 0
          fi
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="${MARKER}
          > 💡 **提示**：当前仓库 star 数不足 10，CodeRabbit 已跳过自动审查，已自动发送 @coderabbitai review 邀请其参与本次审查。PR-Agent 兜底审查不受影响。" || true
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="@coderabbitai review" || true
          sleep 30

  # 3. 核心审查与兜底 Job：CodeRabbit 超额、评论区 /review 指令或手动触发
  pr_agent_review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.sender.type != 'Bot' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/')
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug == 'coderabbitai' &&
        (
          github.event.check_run.conclusion != 'success' ||
          contains(github.event.check_run.output.title, 'rate limited') ||
          contains(github.event.check_run.output.summary, 'Rate limited')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 解析模型名称：复用 GitHub Variables 中配置的 LLM_GATEWAY_REVIEW_MODEL
      - name: Resolve Model Configuration
        id: model_setup
        run: |
          RAW_MODEL="${{ vars.LLM_GATEWAY_REVIEW_MODEL || 'deepseek-chat' }}"
          if [[ "$RAW_MODEL" != *"/"* ]]; then
            RESOLVED_MODEL="openai/$RAW_MODEL"
          else
            RESOLVED_MODEL="$RAW_MODEL"
          fi
          {
            echo "RESOLVED_MODEL=$RESOLVED_MODEL"
            echo "DISPLAY_MODEL=$RAW_MODEL"
          } >> "$GITHUB_ENV"

      # 规范化 PR 上下文并获取 HEAD_SHA
      - name: Prepare PR Event Context
        id: prepare_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_PR_URL: ${{ github.event.check_run.pull_requests[0].url }}
          CHECK_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          COMMENT_PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          HEAD_SHA=""
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            HEAD_SHA=$(gh api "$COMMENT_PR_URL" -q .head.sha)
          elif [ "$EVENT_NAME" = "check_run" ]; then
            HEAD_SHA="$CHECK_HEAD_SHA"
            if [ -n "$CHECK_PR_URL" ] && [ "$CHECK_PR_URL" != "null" ]; then
              PR_NUMBER="${CHECK_PR_URL##*/}"
            else
              PR_NUMBER=$(gh api "repos/${REPO}/commits/${CHECK_HEAD_SHA}/pulls" -q '.[0].number // empty')
              if [ -n "$PR_NUMBER" ]; then
                CHECK_PR_URL="https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}"
              fi
            fi
            HTML_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
            jq -n \
              --arg url "$CHECK_PR_URL" \
              --arg html_url "$HTML_URL" \
              --argjson num "$PR_NUMBER" \
              '{
                action: "created",
                issue: { number: $num, pull_request: { url: $url, html_url: $html_url } },
                pull_request: { number: $num, url: $url, html_url: $html_url },
                comment: { id: 1, body: "/review" },
                sender: { type: "User" }
              }' \
              > "$GITHUB_EVENT_PATH"
            echo "GITHUB_EVENT_NAME=issue_comment" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_PR_URL="https://api.github.com/repos/${REPO}/pulls/${DISPATCH_PR}"
            HEAD_SHA=$(gh api "$TARGET_PR_URL" -q .head.sha)
            HTML_URL="https://github.com/${REPO}/pull/${DISPATCH_PR}"
            jq -n \
              --arg url "$TARGET_PR_URL" \
              --arg html_url "$HTML_URL" \
              --argjson num "$DISPATCH_PR" \
              '{
                action: "created",
                issue: { number: $num, pull_request: { url: $url, html_url: $html_url } },
                pull_request: { number: $num, url: $url, html_url: $html_url },
                comment: { id: 1, body: "/review" },
                sender: { type: "User" }
              }' \
              > "$GITHUB_EVENT_PATH"
            echo "GITHUB_EVENT_NAME=issue_comment" >> "$GITHUB_ENV"
          fi
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      # 如果是通过 CodeRabbit 未成功审查的 Check 触发的，在 PR 留一条友好提示
      - name: Notify fallback to PR Agent
        if: github.event_name == 'check_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_PR_URL: ${{ github.event.check_run.pull_requests[0].url }}
          CHECK_HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          PR_NUMBER=""
          if [ -n "$CHECK_PR_URL" ] && [ "$CHECK_PR_URL" != "null" ]; then
            PR_NUMBER="${CHECK_PR_URL##*/}"
          else
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${CHECK_HEAD_SHA}/pulls" -q '.[0].number // empty')
          fi
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="> 💡 **提示**：检测到 CodeRabbit 未完成审查（跳过或超额），已自动无缝切换至 **PR-Agent（模型：${DISPLAY_MODEL}）** 进行代码审查与改进建议。" || true
          fi

      - name: Run PR Agent with LLM Gateway
        id: run_pr_agent
        # 直接按 digest 运行 github_action 镜像，绕开 action 包装层：
        # qodo-ai/pr-agent@v0.49.0 的 Dockerfile 只是 FROM
        # pragent/pr-agent:github_action（滚动 tag），pin action 版本并不能 pin 住
        # 运行时镜像；该 tag 的新构建会在 apply_repo_settings 内静默退出（无 review、
        # 无错误日志、exit 0）。此 digest 为 2026-10-16 构建，已在本地完整复现
        # （apply_repo_settings 通过、review 正常发起），按上游建议用 digest pin。
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI.KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI.API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          OPENAI__API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          OPENAI_API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          CONFIG.MODEL: ${{ env.RESOLVED_MODEL }}
          CONFIG.FALLBACK_MODELS: "['${{ env.RESOLVED_MODEL }}']"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "128000"
          CONFIG.MAX_MODEL_TOKENS: "64000"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Please write the entire review, summaries, explanations, and advice in Simplified Chinese (简体中文). Pay special attention to security, boundary conditions, and test coverage."
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: "Please write all suggestions and explanations in Simplified Chinese (简体中文)."
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: "Please write the PR description and summary in Simplified Chinese (简体中文)."

      # PR-Agent 执行完成后更新门禁状态。
      # 步骤 exit 0 不等于审查真实发生：曾出现容器静默退出（无评论、无报错、
      # 网关零请求）却把门禁标成通过。这里以 HEAD SHA 上 PR-Agent 的实际输出
      # （review 或评论）为准，没有则判失败，避免假阳性放行。
      - name: Verify review landed and update AI Review Gate
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          OUTCOME: ${{ steps.run_pr_agent.outcome }}
        run: |
          set -euo pipefail
          # dispatch/check_run 路径 PR_NUMBER 可能为空，从 PR API 反查。
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" -q '.[0].number // empty')
          fi

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "未找到对应的 PR，无法验证审查产出。"
            if [ -n "${HEAD_SHA}" ]; then
              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state="failure" \
                -f context="AI Review Gate" \
                -f description="未找到关联 PR，无法验证审查" || true
            fi
            exit 1
          fi

          landed=false
          if [ "$OUTCOME" = "success" ]; then
            # PR-Agent 的输出：issue 评论（walkthrough/摘要）或 review（/review 的评审）。
            # 以 HEAD SHA 起算：本次运行之后才产生的 bot 输出才算本次审查落地。
            START_EPOCH=$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}" -q .run_started_at | xargs -I{} date -d "{}" +%s)
            START_EPOCH=$((START_EPOCH - 60))
            while IFS= read -r line; do
              created=$(echo "$line" | jq -r '.createdAt // empty')
              [ -z "$created" ] && continue
              author=$(echo "$line" | jq -r '.author')
              body=$(echo "$line" | jq -r '.body // ""')
              created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
              case "$author" in
                github-actions*|pr-agent*|qodo*)
                  if [ "$created_epoch" -ge "$START_EPOCH" ] \
                     && { echo "$body" | grep -qiE "pr-agent|PR Reviewer Guide" || echo "$body" | grep -q "${HEAD_SHA:0:7}"; }; then
                    landed=true
                    break
                  fi
                  ;;
              esac
            done < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json comments --jq '.comments[] | {createdAt, author: (.author.login // ""), body: (.body // "")}')
            if [ "$landed" != "true" ]; then
              while IFS= read -r line; do
                created=$(echo "$line" | jq -r '.submittedAt // empty')
                [ -z "$created" ] && continue
                author=$(echo "$line" | jq -r '.author')
                body=$(echo "$line" | jq -r '.body // ""')
                created_epoch=$(date -d "$created" +%s 2>/dev/null || echo 0)
                case "$author" in
                  github-actions*|pr-agent*|qodo*)
                    if [ "$created_epoch" -ge "$START_EPOCH" ] \
                       && { echo "$body" | grep -qiE "pr-agent|PR Reviewer Guide" || echo "$body" | grep -q "${HEAD_SHA:0:7}"; }; then
                      landed=true
                      break
                    fi
                    ;;
                esac
              done < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json reviews --jq '.reviews[] | {submittedAt, author: (.author.login // ""), body: (.body // "")}')
            fi
          fi

          if [ "$landed" = "true" ]; then
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="success" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 审查通过" || true
          elif [ "$OUTCOME" = "success" ]; then
            echo "::warning::PR-Agent 步骤成功但 PR 上没有它的输出（评论/review），疑似静默失败"
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="failure" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 未产出审查（静默失败），请查看 Actions 日志" || true
            exit 1
          else
            gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="failure" \
              -f context="AI Review Gate" \
              -f description="PR-Agent 审查未通过或执行异常" || true
            exit 1
          fi
