name: PR Agent

on:
  pull_request:
    # Review new commits as well as the initial reviewable state.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  # GitHub requires contents: write to resolve review threads via GraphQL.
  contents: write
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    name: Review via gateway
    # Keep concurrency at job level so an unauthorized comment cannot cancel
    # a running review. Include the event and comment id so /ask does not
    # cancel an automatic review.
    concurrency:
      group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'auto' }}
      cancel-in-progress: true
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'pull_request' &&
          !github.event.pull_request.draft
        ) ||
        (
          (
            (
              github.event_name == 'issue_comment' &&
              github.event.issue.pull_request != null &&
              startsWith(github.event.comment.body, '/')
            ) ||
            (
              github.event_name == 'pull_request_review_comment' &&
              contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
            )
          )
        )
      )
    runs-on: ${{ fromJSON(vars.PR_AGENT_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Check out trusted workflow scripts
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare automatic review-thread reply
        id: prepare
        if: github.event_name == 'pull_request_review_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/prepare-pr-agent-thread-reply.py

      - name: Run PR-Agent
        if: steps.prepare.outputs.should_run != 'false'
        uses: The-PR-Agent/pr-agent@v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          OPENAI__API_BASE: ${{ vars.LLM_GATEWAY_BASE_URL }}
          CONFIG__MODEL: openai/gemini-3.8-flash
          CONFIG__FALLBACK_MODELS: '["openai/deepseek-flash", "openai/gemini-3.8-flash"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-CN"
          CONFIG__MAX_MODEL_TOKENS: "96000"
          CONFIG__MAX_OUTPUT_TOKENS: "24000"
          CONFIG__REASONING_EFFORT: "low"
          CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: '["deepseek-flash", "gemini-3.8-flash"]'
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          PR_QUESTIONS__RESOLVE_THREADS: ${{ steps.prepare.outputs.resolve_threads || 'false' }}
          PR_QUESTIONS__USE_CONVERSATION_HISTORY: "true"
          LITELLM__FORCE_STREAMING_CUSTOM_LLM_PROVIDER: "openai"
          LITELLM__FORCE_STREAMING_API_BASE_SUBSTRINGS: '["/v1"]'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
