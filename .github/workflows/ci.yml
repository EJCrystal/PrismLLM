name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      ci: ${{ steps.filter.outputs.ci }}
      shared: ${{ steps.filter.outputs.shared }}
      protocol: ${{ steps.filter.outputs.protocol }}
      channel: ${{ steps.filter.outputs.channel }}
      routing: ${{ steps.filter.outputs.routing }}
      resilience: ${{ steps.filter.outputs.resilience }}
      oauth: ${{ steps.filter.outputs.oauth }}
      quota: ${{ steps.filter.outputs.quota }}
      app: ${{ steps.filter.outputs.app }}
      build: ${{ steps.filter.outputs.build }}
      extensions: ${{ steps.filter.outputs.extensions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Force a git diff instead of the 3,000-file pull request API limit.
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            frontend:
              - 'web/**'
              - 'Dockerfile'
            backend:
              - 'prism-shared/**'
              - 'prism-protocol/**'
              - 'prism-channel/**'
              - 'prism-routing/**'
              - 'prism-resilience/**'
              - 'prism-subscription-oauth/**'
              - 'prism-quota/**'
              - 'prism-app/**'
              - 'extensions/**'
              - 'pom.xml'
              - 'Dockerfile'
            shared:
              - 'prism-shared/**'
            protocol:
              - 'prism-protocol/**'
            channel:
              - 'prism-channel/**'
            routing:
              - 'prism-routing/**'
            resilience:
              - 'prism-resilience/**'
            oauth:
              - 'prism-subscription-oauth/**'
            quota:
              - 'prism-quota/**'
            app:
              - 'prism-app/**'
            build:
              - 'pom.xml'
              - 'Dockerfile'
            extensions:
              - 'extensions/**'
            monitoring:
              - 'monitoring/**'
            ci:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.coderabbit.yaml'

  workflow:
    name: Validate workflow
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow YAML and expressions
        run: |
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.7 \
            -color "${workflow_files[@]}"

      - name: Validate PR-Agent gate script
        run: python3 -m py_compile .github/scripts/pr_agent_gate.py

      - name: Validate review bot config
        run: |
          # CodeRabbit 配置是 YAML；runner 未预装 PyYAML 时跳过解析而不是误报失败。
          if python3 -c "import yaml" 2>/dev/null; then
            python3 -c "import yaml; yaml.safe_load(open('.coderabbit.yaml'))"
          else
            echo "::warning::PyYAML 不可用，跳过 .coderabbit.yaml 解析"
          fi

  frontend:
    name: Test frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Type check frontend
        run: npm --prefix web run typecheck

      - name: Test frontend
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

  backend:
    name: Test backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve affected test modules
        id: modules
        run: |
          modules=""
          app_tests="false"
          app_tags=""
          # 共享内核与根构建变更影响所有模块；其余变更只验证自身及下游。
          if [ "${{ needs.changes.outputs.build }}" = "true" ] || [ "${{ needs.changes.outputs.shared }}" = "true" ]; then
            modules="prism-shared,prism-protocol,prism-channel,prism-routing,prism-resilience,prism-subscription-oauth,prism-quota"
            app_tests="true"
          else
            if [ "${{ needs.changes.outputs.protocol }}" = "true" ]; then modules="prism-protocol"; fi
            if [ "${{ needs.changes.outputs.channel }}" = "true" ]; then modules="${modules:+$modules,}prism-channel"; fi
            # resilience 与 subscription-oauth 只依赖共享内核，quota 是不依赖任何领域模块的纯函数模块；变更时验证自身即可，app 是它们的下游。
            if [ "${{ needs.changes.outputs.resilience }}" = "true" ]; then modules="${modules:+$modules,}prism-resilience"; fi
            if [ "${{ needs.changes.outputs.oauth }}" = "true" ]; then modules="${modules:+$modules,}prism-subscription-oauth"; fi
            if [ "${{ needs.changes.outputs.quota }}" = "true" ]; then modules="${modules:+$modules,}prism-quota"; fi
            # routing 依赖 channel 与 protocol：上游模块变更同样要验证 routing 的编译与单测。
            if [ "${{ needs.changes.outputs.channel }}" = "true" ] \
              || [ "${{ needs.changes.outputs.protocol }}" = "true" ] \
              || [ "${{ needs.changes.outputs.routing }}" = "true" ]; then
              modules="${modules:+$modules,}prism-routing"
            fi
            # app 是组合根，覆盖 routing/channel/protocol 的集成行为；上游模块变更必须连同它一起验证。
            if [ "${{ needs.changes.outputs.app }}" = "true" ] \
              || [ "${{ needs.changes.outputs.protocol }}" = "true" ] \
              || [ "${{ needs.changes.outputs.channel }}" = "true" ] \
              || [ "${{ needs.changes.outputs.routing }}" = "true" ] \
              || [ "${{ needs.changes.outputs.resilience }}" = "true" ] \
              || [ "${{ needs.changes.outputs.oauth }}" = "true" ] \
              || [ "${{ needs.changes.outputs.quota }}" = "true" ]; then
              app_tests="true"
            fi
            # app 自身、routing、resilience、oauth 或 quota 变更跑全量；只有 protocol/channel 变更时，按模块标签只跑相关集成测试。
            # 单元测试始终全量执行，标签只用于筛选慢速集成测试。
            if [ "${{ needs.changes.outputs.app }}" != "true" ] \
              && [ "${{ needs.changes.outputs.routing }}" != "true" ] \
              && [ "${{ needs.changes.outputs.resilience }}" != "true" ] \
              && [ "${{ needs.changes.outputs.oauth }}" != "true" ] \
              && [ "${{ needs.changes.outputs.quota }}" != "true" ]; then
              if [ "${{ needs.changes.outputs.channel }}" = "true" ]; then app_tags="channel"; fi
              # Surefire 的 groups 支持 JUnit Platform 标签表达式，用 | 明确表达 OR。
              if [ "${{ needs.changes.outputs.protocol }}" = "true" ]; then app_tags="${app_tags:+$app_tags|}protocol"; fi
            fi
          fi
          {
            echo "modules=$modules"
            echo "app_tests=$app_tests"
            echo "app_tags=$app_tags"
          } >> "$GITHUB_OUTPUT"
          echo "Affected upstream test modules: ${modules:-none}"
          echo "App tests: ${app_tests} (tags: ${app_tags:-all})"

      - name: Compile backend and install plugin SPI
        run: mvn --batch-mode -DskipTests install

      - name: Test affected upstream modules
        if: steps.modules.outputs.modules != ''
        run: mvn --batch-mode -pl "${{ steps.modules.outputs.modules }}" test

      - name: Test app module
        if: steps.modules.outputs.app_tests == 'true'
        env:
          APP_TAGS: ${{ steps.modules.outputs.app_tags }}
        run: |
          if [ -z "$APP_TAGS" ]; then
            mvn --batch-mode -pl prism-app test
          else
            # 只接受本 workflow 自己生成的两个标签组合，避免把输出直接拼进表达式。
            case "$APP_TAGS" in
              "channel"|"protocol") excluded="integration & !($APP_TAGS)" ;;
              "channel|protocol"|"protocol|channel") excluded="integration & !(channel|protocol)" ;;
              *)
                echo "::error::未知的应用层测试标签：$APP_TAGS"
                exit 1
                ;;
            esac
            # 单元测试全量执行；只排除与本次上游模块无关的集成测试。
            # 必须和单元测试放在同一个 Maven 进程里，避免二次启动 Testcontainers
            # 反而比全量套件更慢。
            mvn --batch-mode -pl prism-app test \
              -DexcludedGroups="$excluded" \
              -DfailIfNoTests=true
          fi

      - name: Test optional quota providers
        if: needs.changes.outputs.extensions == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.build == 'true'
        run: mvn --batch-mode -f extensions/quota-providers/pom.xml verify

  monitoring:
    name: Validate monitoring
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check rules /etc/prometheus/alerts.yml
