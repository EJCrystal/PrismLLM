name: CI

on:
  pull_request:
    # Docs-only changes do not need the backend/frontend test suite, but
    # monitoring files must always run the Prometheus validation.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "monitoring/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "monitoring/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Test frontend
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check rules /etc/prometheus/alerts.yml

      - name: Test backend
        run: mvn --batch-mode test
