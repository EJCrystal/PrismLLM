name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Force a git diff instead of the 3,000-file pull request API limit.
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          predicate-quantifier: 'some-with-excludes'
          filters: |
            frontend:
              - 'web/**'
              - 'Dockerfile'
            backend:
              - 'prism-shared/**'
              - 'prism-protocol/**'
              - 'prism-app/**'
              - 'extensions/**'
              - 'pom.xml'
              - 'Dockerfile'
            monitoring:
              - 'monitoring/**'
            ci:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.coderabbit.yaml'

  workflow:
    name: Validate workflow
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow YAML and expressions
        run: |
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.7 \
            -color "${workflow_files[@]}"

      - name: Validate PR-Agent gate script
        run: python3 -m py_compile .github/scripts/pr_agent_gate.py

      - name: Validate review bot config
        run: |
          # CodeRabbit 配置是 YAML；runner 未预装 PyYAML 时跳过解析而不是误报失败。
          if python3 -c "import yaml" 2>/dev/null; then
            python3 -c "import yaml; yaml.safe_load(open('.coderabbit.yaml'))"
          else
            echo "::warning::PyYAML 不可用，跳过 .coderabbit.yaml 解析"
          fi

  frontend:
    name: Test frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Type check frontend
        run: npm --prefix web run typecheck

      - name: Test frontend
        run: npm --prefix web test

      - name: Build frontend
        run: npm --prefix web run build

  backend:
    name: Test backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend and install plugin SPI
        run: mvn --batch-mode install

      - name: Test optional quota providers
        run: mvn --batch-mode -f extensions/quota-providers/pom.xml verify

  monitoring:
    name: Validate monitoring
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$GITHUB_WORKSPACE/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.7.2 \
            check rules /etc/prometheus/alerts.yml
