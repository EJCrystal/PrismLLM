groups:
  - name: PrismLLM
    rules:
      - alert: PrismLlmDown
        expr: up{job="PrismLLM"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PrismLLM target is down
          description: Prometheus has failed to scrape {{ $labels.instance }} for 2 minutes.

      - alert: PrismLlmNotReady
        expr: |
          (probe_success{job="PrismLLM-ready"} == 0)
          or
          (up{job="PrismLLM-ready"} == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PrismLLM readiness probe failed
          description: The gateway readiness endpoint has failed for 2 minutes; inspect /health/ready and database connectivity.

      - alert: PrismLlmHighErrorRate
        expr: |
          (
            sum(rate(gateway_requests_total{outcome="error"}[5m]))
            /
            clamp_min(sum(rate(gateway_requests_total[5m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PrismLLM error rate exceeds 5%
          description: Error requests are {{ $value | humanizePercentage }} of traffic over the last 5 minutes.

      - alert: PrismLlmHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(gateway_request_duration_seconds_bucket[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PrismLLM p95 latency exceeds 10 seconds
          description: The complete-request p95 latency is {{ $value | humanizeDuration }}.

      - alert: PrismLlmQuotaRejections
        expr: sum(rate(gateway_quota_rejections_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PrismLLM is frequently rejecting quota-exceeded requests
          description: Quota rejections are {{ $value | humanize }} per second; review affected key limits and consume patterns.

      - alert: PrismLlmAuditWriteFailures
        expr: increase(gateway_admin_audit_write_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: PrismLLM failed to persist a management audit record
          description: At least one management write completed without its audit record; inspect gateway logs and database health immediately.

      - alert: PrismLlmUpstreamUnhealthy
        expr: |
          (
            sum by (channel) (rate(gateway_upstream_attempts_total{outcome="error"}[5m]))
            /
            clamp_min(sum by (channel) (rate(gateway_upstream_attempts_total[5m])), 0.001)
          ) > 0.2
          and on(channel)
          sum by (channel) (rate(gateway_upstream_attempts_total[5m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Upstream channel {{ $labels.channel }} has a high failure rate
          description: Channel {{ $labels.channel }} has failed more than 20% of attempts for 10 minutes.

      - alert: PrismLlmUpstreamCooldown
        expr: increase(gateway_upstream_cooldown_started_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Upstream candidate on channel {{ $labels.channel }} entered cooldown ({{ $labels.reason }})
          description: Channel {{ $labels.channel }} failed with reason {{ $labels.reason }} and its candidate is postponed by cooldown; requests fall over to the next tier, with fail-open retries when everything is cooling.
