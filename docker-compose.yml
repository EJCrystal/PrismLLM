name: prism-llm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: llm_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    restart: unless-stopped
    # Increase this budget with DRAIN_TIMEOUT_MS; allow extra time for server and queue cleanup.
    stop_grace_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/llm_gateway
      PLUGIN_CATALOG_DIR: /app/bundled-plugins
      PLUGIN_INSTALL_DIR: /app/plugin-state
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Legacy quota-provider/IQ-judge JARs stay in their independent read-only directory.
    # The trusted diagnostic catalog is image-owned; managed packages need writable persistent state.
    volumes:
      - ./plugins:/app/plugins:ro
      - pluginstate:/app/plugin-state
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: prism-llm_pgdata
  pluginstate:
    name: prism-llm_pluginstate

networks:
  default:
    name: prism-llm_default
