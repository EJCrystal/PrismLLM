name: prism-llm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: llm_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/llm_gateway
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Put trusted quota-provider and IQ-judge JARs in ./plugins. The directory is read-only in the container.
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: prism-llm_pgdata

networks:
  default:
    name: prism-llm_default
