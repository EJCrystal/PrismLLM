<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>PrismLLM · 管理台</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('prism_llm_theme') || localStorage.getItem('llm_gw_theme');
          var p = localStorage.getItem('prism_llm_palette');
          var mode = t === 'dark' ? 'dark' : 'light';
          var valid = { gemini: 1, sky: 1, cyan: 1, orange: 1, red: 1, purple: 1 };
          var palette = p && valid[p] ? p : (t === 'sepia' ? 'orange' : 'gemini');
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
