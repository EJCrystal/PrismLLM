# API key and gateway URL are injected by the workflow; model order and review behavior live here.

[config]
# Three sequential 120s model attempts need room to complete before PR-Agent times out.
ai_timeout = 480
model = "openai/gpt-6-luna"
fallback_models = ["openai/deepseek-flash", "openai/gemini-3.8-flash"]
# Move to the next fallback on timeout without replaying the same model.
retry_same_model_on_timeout = false
# Any OpenAI-compatible model ID that litellm does not know needs its window
# declared; the gateway routes this name to a real upstream model.
custom_model_max_tokens = 256000
# 与 workflow 保持一致；总预算必须明显大于输出预算，给输入留足空间。
max_model_tokens = 96000
# 代码审查需要少量跨文件推理；low 在质量和 token 消耗之间更稳。
reasoning_effort = "low"
additional_reasoning_effort_models = ["gpt-6-luna", "deepseek-flash", "gemini-3.8-flash"]
# 推理 token 计入输出预算；预留 24000，避免结论生成前被截断。
max_output_tokens = 24000

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = false
inline_key_issues = true
# 前后端问题可能同时出现；保留足够空间，避免前端发现被后端问题挤掉。
num_max_findings = 8
persistent_comment = true
extra_instructions = """
这是一个 Kotlin + Ktor 的 OpenAI 兼容 LLM 网关，请按以下重点审查：

1. 流式转发：SSE 透传不能缓冲、不能吞掉上游错误，客户端断开必须向上游传播取消。
2. 凭据处理：调用方密钥、上游凭据、GATEWAY_MASTER_KEY 不得出现在日志、异常信息或响应体里。
3. 协议兼容：/v1/chat/completions 与 /v1/responses 的请求/响应字段要与 OpenAI 契约一致，不要擅自改写未知字段。
4. 路由正确性：按请求协议过滤渠道，baseUrl 已含版本路径，不允许自动补 /v1 或重复拼接。
5. 数据库与事务：Flyway 迁移需可重入且不回改历史脚本；并发路径避免竞态。
6. 错误处理：超时、上游 4xx/5xx、解析失败要有明确映射，不要静默失败。
7. 后端测试：行为变更应附带测试；指出缺失的并发、错误路径和边界用例。

同时检查 Vue 3 前端的以下风险：

8. 前端状态：编辑与新建流程不能互相污染；编辑已有数据时必须保留后端已保存的开关、协议、模型授权和映射设置。重置、关闭、异步刷新和请求竞态不能造成状态丢失或旧响应覆盖新状态。
9. 可访问性：可点击元素优先使用原生 button 或 link；确保键盘可聚焦、可激活、有可见焦点，并具有准确的 aria-label、标题和键盘操作反馈。
10. 主题：弹框、表单、表格、下拉框、日期控件、提示、滚动条和交互反馈在 light、dark、sepia 主题下都必须可读；不得依赖只适用于单一主题的硬编码颜色。
11. 交互测试：点击、键盘操作、表单状态流转、API 请求体、格式化精度和主题持久化等行为变更必须配套前端测试；测试应验证真实对外行为，避免复制实现逻辑。

每条问题写明：文件与位置、实际影响、可执行的修复建议。
不要复述 diff；不确定的推断标注为“待确认”，不要编造不存在的 API 或配置。
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
focus_only_on_problems = true
suggestions_score_threshold = 7

[pr_description]
publish_description_as_comment = false
add_original_user_description = true
enable_pr_diagram = true
